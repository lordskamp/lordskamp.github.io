<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><style>
body{margin:0;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#172c23);font-family:system-ui,sans-serif;font-size:14px}
.app{padding:12px 14px 20px 22px}h1{font-size:17px;margin:0 0 8px}.hint{font-size:12px;color:var(--tg-theme-hint-color,#68786d);margin:4px 0 7px}
.field{display:block;width:100%;text-align:left;background:var(--tg-theme-secondary-bg-color,#f1f5f0);color:inherit;border:1px solid #bfcac1;border-radius:8px;padding:6px 8px;margin:4px 0;font-size:13px}.field.active{border:2px solid var(--tg-theme-button-color,#327452);padding:5px 7px}.field b{display:block;overflow-wrap:anywhere;font-size:16px;min-height:21px}.field span{font-size:11px;color:var(--tg-theme-hint-color,#68786d)}
.result{background:var(--tg-theme-secondary-bg-color,#f1f5f0);border-radius:8px;padding:7px 8px;margin:7px 0;overflow-wrap:anywhere}.result div{font-size:12px;color:var(--tg-theme-hint-color,#68786d)}.result strong{display:block;color:var(--tg-theme-text-color,#172c23);font-size:16px}.error{color:#b33327;font-size:12px;margin:4px 0;min-height:15px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.keys button,.add{background:var(--tg-theme-secondary-bg-color,#edf2ec);color:var(--tg-theme-text-color,#172c23);border:0;border-radius:7px;height:37px;font-size:16px;font-weight:600}.add{width:100%;margin-top:4px;height:33px;font-size:13px}.link{background:var(--tg-theme-button-color,#327452);color:var(--tg-theme-button-text-color,#fff);border:0;border-radius:8px;width:100%;height:35px;margin-top:7px;font-size:13px;font-weight:600}
@media (max-width:260px){.app{padding:8px 8px 12px 21px}h1{font-size:15px;margin-bottom:3px}.hint{font-size:10px;margin:2px 0}.field{margin:3px 0}.field b{font-size:13px;line-height:16px;min-height:16px}.result{padding:4px 6px;margin:4px 0}.result strong{font-size:13px;line-height:16px}.keys button{height:28px}.add{height:26px}.link{height:28px;margin-top:4px}.error{margin:2px 0}}
body.compact .app{padding:8px 8px 12px 21px}body.compact h1{font-size:15px;margin-bottom:3px}body.compact .hint{font-size:10px;margin:2px 0}body.compact .field{margin:3px 0}body.compact .field b{font-size:13px;line-height:16px;min-height:16px}body.compact .result{padding:4px 6px;margin:4px 0}body.compact .result strong{font-size:13px;line-height:16px}body.compact .keys button{height:28px}body.compact .add{height:26px}body.compact .link{height:28px;margin-top:4px}body.compact .error{margin:2px 0}
</style></head><body><div class="app"><h1>Планування скрутки</h1><div class="hint">Обери рядок і введи метри кнопками</div>
<button class="field active" id="length"><span>Потрібна довжина, м</span><b id="length-value">—</b></button><button class="field" id="marks"><span>Пробої на лічильнику, м</span><b id="marks-value">—</b></button>
<div class="result"><div>Записати на лейбл</div><strong id="label">—</strong><div>Ввести на екрані, м</div><strong id="screen">—</strong></div><p class="error" id="error"></p>
<div class="keys"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="clear">C</button><button data-key="0">0</button><button data-key="back">⌫</button></div>
<button class="add" id="separator">＋ Наступний пробій</button><button class="link" id="open">Відкрити Завод</button></div>
<script>
(function(){
  var state={length:'',marks:'',active:'length'};
  var byId=function(id){return document.getElementById(id)};
  try{var saved=JSON.parse(localStorage.getItem('splice')||'null');if(saved&&typeof saved.length==='string'&&typeof saved.marks==='string'){state.length=saved.length.replace(/[^0-9]/g,'').slice(0,7);state.marks=saved.marks.replace(/[^0-9,]/g,'').slice(0,63)}}catch(e){}
  function update(){
    document.body.className=state.marks.length>16?'compact':'';
    byId('length').className='field'+(state.active==='length'?' active':'');byId('marks').className='field'+(state.active==='marks'?' active':'');
    byId('length-value').textContent=state.length||'—';byId('marks-value').textContent=state.marks.replace(/,/g,', ')||'—';
    var length=Number(state.length), raw=state.marks.split(',').filter(function(v){return v!==''}), marks=raw.map(Number).sort(function(a,b){return a-b}), rounded=marks.map(function(v){return Math.floor(v/10)*10}), message='';
    if(!length)message='Вкажи потрібну довжину.';
    else if(marks.some(function(v){return v<=0||v>=length}))message='Пробій має бути між початком і кінцем.';
    else if(rounded.some(function(v,i){return v===0||(i>0&&v===rounded[i-1])}))message='Перевір пробої після округлення до 10 м.';
    else if(state.marks.endsWith(','))message='Введи наступний пробій.';
    var prev=0, parts=rounded.concat([length]).map(function(v){var part=v-prev;prev=v;return part});
    byId('label').textContent=message?'—':'('+parts.join('+')+')';byId('screen').textContent=message?'—':String(length+marks.length*30);byId('error').textContent=message;
    try{localStorage.setItem('splice',JSON.stringify({length:state.length,marks:state.marks}))}catch(e){}
  }
  byId('length').addEventListener('click',function(){state.active='length';update()});byId('marks').addEventListener('click',function(){state.active='marks';update()});
  Array.prototype.forEach.call(document.querySelectorAll('[data-key]'),function(button){button.addEventListener('click',function(){var key=button.getAttribute('data-key'),value=state[state.active];if(key==='clear')value='';else if(key==='back')value=value.slice(0,-1);else if((state.active==='length'&&value.length<7)||(state.active==='marks'&&value.length<63&&value.split(',').slice(-1)[0].length<7))value+=key;state[state.active]=value;update()})});
  byId('separator').addEventListener('click',function(){state.active='marks';if(state.marks&&!state.marks.endsWith(',')&&state.marks.split(',').length<8)state.marks+=',';update()});
  byId('open').addEventListener('click',function(){if(typeof TelegramWidget!=='undefined'&&TelegramWidget.openTelegramLink)TelegramWidget.openTelegramLink('https://t.me/obpresyvanya_bot?startapp')});
  update();if(typeof TelegramWidget!=='undefined'&&TelegramWidget.ready)TelegramWidget.ready();
})();
</script></body></html>
